<!doctype html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>NDS PHP – Dokumentation</title>
	<meta name="description" content="Dokumentation von NDS PHP: Bedienung, Editor, REPL, PHP-Dialekt, mehrere Dateien, Grafik, Sprites, Sound und Speichern.">
	<link rel="icon" href="img/title-top.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
	<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
<header class="site-header">
	<div class="wrap">
		<a class="logo" href="index.de.html"><span class="tile">&lt;&gt;</span>NDS&nbsp;<span>PHP</span></a>
		<nav class="nav">
			<a href="index.de.html">Startseite</a>
			<a href="@REPO_URL@">GitHub</a>
			<a class="nav-cta" href="nds-php.nds" download>Download</a>
			<span class="lang-switch" aria-label="Sprache"><a href="docs.html" hreflang="en" lang="en">EN</a><a aria-current="page">DE</a></span>
		</nav>
	</div>
</header>

<main class="docs-layout">
	<div class="wrap">
		<article id="doc" class="markdown">
			<p class="docs-loading">LOADING DOKU...</p>
		</article>
	</div>
</main>

<footer class="site-footer">
	<div class="wrap">
		<span>Diese Seite zeigt die <a href="@REPO_URL@#readme">README</a> des Projekts.</span>
		<span>Build <code>@BUILD_SHA@</code></span>
	</div>
</footer>

<script>
/* The README of the repository is copied next to this page at build time
   and rendered here, so the documentation always matches the ROM. */
(async function () {
	const el = document.getElementById("doc");
	try {
		const res = await fetch("README.md", { cache: "no-cache" });
		if (!res.ok) throw new Error(res.status);
		el.innerHTML = marked.parse(await res.text());
		/* README links: the other language -> its docs page, repo files -> GitHub */
		el.querySelectorAll("a[href]").forEach(function (a) {
			const h = a.getAttribute("href");
			if (h === "README.md") a.href = "docs.de.html";
			else if (h === "README.en.md") a.href = "docs.html";
			else if (!/^([a-z]+:|#)/i.test(h)) a.href = "@REPO_URL@/blob/main/" + h;
		});
		document.title = "NDS PHP – Dokumentation";
		if (location.hash) {
			const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
			if (target) target.scrollIntoView();
		}
	} catch (e) {
		el.innerHTML = '<p class="docs-loading">Die Doku konnte nicht geladen werden.<br><br>' +
			'<a href="@REPO_URL@#readme">README auf GitHub lesen</a></p>';
	}
})();
</script>
</body>
</html>
